# GreenSky - configuração principal.
# Regra validada no boot: spacing > max-size + spacing-margin.
# Se não passar, o plugin NÃO sobe.

islands:
  initial-size: 100     # tamanho inicial da ilha (blocos)
  max-size: 1000        # maior tamanho que uma ilha pode atingir
  spacing: 1200         # distância centro a centro entre ilhas
  spacing-margin: 100   # folga mínima entre áreas de ilhas vizinhas
  base-y: 100           # altura da superfície da ilha inicial
  starter-radius: 4     # raio do disco da ilha inicial (diâmetro deve caber em initial-size)
  # Tamanho (lado) de cada nível de expansão. Começa em initial-size, cresce sempre, até max-size.
  # A ilha nunca se move: só a área liberada aumenta, a partir do mesmo centro.
  expansion-levels: [100, 150, 200, 300, 500]
  # Visibilidade de ilhas novas: public (qualquer um pode /is visit) ou private (só membros).
  default-visibility: public

database:
  host: 127.0.0.1
  port: 5432
  name: greensky
  user: greensky
  pool-size: 10
  # A senha NUNCA fica aqui: use a variável de ambiente GREENSKY_DB_PASSWORD.

world:
  name: greensky_world  # pasta do mundo SkyBlock; nao pode ser world/world_nether/world_the_end
  spawn-y: 100          # altura do spawn fixo (mundo void)

performance:
  max-entities-per-island: 500
